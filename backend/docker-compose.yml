services:
  db:
    image: postgres:16-alpine
    container_name: smart_waste_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Wajib diisi di .env (fail-closed, tanpa fallback repo).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di backend/.env}
      POSTGRES_DB: smart_waste_db
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_waste_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opsional: storage rate limiter bersama lintas worker (set REDIS_URL).
  redis:
    image: redis:7-alpine
    container_name: smart_waste_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
